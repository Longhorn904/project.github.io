<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Longhorn_904 项目站</title>
<style>
:root{--bg:#fff;--tx:#333;--card:#f5f5f5;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--tx:#eee;--card:#1e1e1e;--bd:#333}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:40px 20px;gap:40px}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:15px;margin-top:20px}
.logo{width:64px;height:64px;display:flex;align-items:center;justify-content:center;border:none;background:transparent}
h1{font-size:22px;font-weight:600}
main{width:100%;max-width:1000px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.card{width:480px;background:var(--card);border:1px solid var(--bd);text-decoration:none;color:var(--tx);display:flex;flex-direction:column;transition:transform .1s}
.card:active{transform:scale(.98)}
.img{width:100%;height:270px;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.6}
.txt{padding:15px;display:flex;flex-direction:column;gap:8px}
.txt h2{font-size:16px;font-weight:600;line-height:1.3}
.txt p{font-size:13px;opacity:.8;line-height:1.4}
</style>
</head>
<body>
<header>
<div class="logo"><img src="WebIcon.png" style="width:100%;height:100%;object-fit:contain"></div>
<h1>Longhorn_904 项目站</h1>
</header>
<main>
<a class="card" href="https://wwbku.lanzoub.com/i8epS4as0b8h" target="_blank" rel="noopener">
<div class="img"><img src="Cover/1.png" style="width:100%;height:100%;object-fit:cover"></div>
<div class="txt">
<h2>Water Mirror</h2>
<p>Longhorn_904 开发的一个简易游戏，项目还正在开发。目前v02公测版本发布，文件展示为游戏开头场景，如果有想法可以联系作者。</p>
</div>
</a>
<a class="card" href="https://wwbku.lanzoub.com/iGjD64as0b9i" target="_blank" rel="noopener">
<div class="img"><img src="Cover/2.png" style="width:100%;height:100%;object-fit:cover"></div>
<div class="txt">
<h2>!?67?!</h2>
<p>一个恶搞HTML文件，打开之后会一直重复生成“67”，然后卡顿。对于你的设备不会造成危害，请放心使用。</p>
</div>
</a>
</main>
</body>
</html>
